name: annotate_utr5
description: "Move the 5' end of coding mRNAs to a CAGE TSS (auto, closest_atg or dominant) and annotate sl / nosl 5' UTRs"
keywords:
  - "cage"
  - "5' UTR"
  - "spliced leader"
  - "gff3"
tools:
  - python:
      description: Python 3 script from the pipeline bin/ directory (annotate_utr5.py, standard library only)
      homepage: https://www.python.org
      licence:
        - "PSF-2.0"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing annotation information
          e.g. [ id:'I25_prim' ]
    - gff:
        type: file
        description: "Gene annotation (EGAPx GFF3)"
        pattern: "*.{gff,gff3}"
    - tss:
        type: file
        description: "TSS table from CAGE_TSS_TABLE"
        pattern: "*.tss.tsv"
    - fasta:
        type: file
        description: "Genome FASTA, for the AG check of spliced-leader acceptors"
        pattern: "*.{fa,fasta,fna}"
output:
  gff:
    - - meta:
          type: map
          description: |
            Groovy Map containing annotation information
            e.g. [ id:'I25_prim' ]
      - "*.utr5.gff3":
          type: file
          description: "Annotation with CAGE 5' ends and five_prime_UTR / trans_splice_acceptor_site rows"
          pattern: "*.utr5.gff3"
  log:
    - - meta:
          type: map
          description: |
            Groovy Map containing annotation information
            e.g. [ id:'I25_prim' ]
      - "*.utr5.log":
          type: file
          description: "Counts of mRNAs per outcome"
          pattern: "*.utr5.log"
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - python --version | sed 's/Python //':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - python --version | sed 's/Python //':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@johannesnicolaus"
maintainers:
  - "@johannesnicolaus"
