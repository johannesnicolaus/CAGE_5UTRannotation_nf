name: scan_pas
description: "Find polyadenylation-signal motifs (default AATAAA,ATTAAA) on both strands of a genome"
keywords:
  - "polyadenylation"
  - "motif"
  - "genome"
tools:
  - python:
      description: Python 3 script from the pipeline bin/ directory (scan_pas.py, standard library only)
      homepage: https://www.python.org
      licence:
        - "PSF-2.0"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing annotation information
          e.g. [ id:'I25_prim' ]
    - fasta:
        type: file
        description: "Genome FASTA"
        pattern: "*.{fa,fasta,fna}"
output:
  bed:
    - - meta:
          type: map
          description: |
            Groovy Map containing annotation information
            e.g. [ id:'I25_prim' ]
      - "*.pas.bed":
          type: file
          description: "BED6 of motif occurrences; name = motif, strand = RNA strand"
          pattern: "*.pas.bed"
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - python --version | sed 's/Python //':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - python --version | sed 's/Python //':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@johannesnicolaus"
maintainers:
  - "@johannesnicolaus"
