name: cage_tss_table
description: "Turn CAGE TSS clusters (luscombeu/cagescan results, or BED files from any CAGE workflow) into one TSS table labelled sl / nosl"
keywords:
  - "cage"
  - "tss"
  - "spliced leader"
tools:
  - python:
      description: Python 3 script from the pipeline bin/ directory (cage_tss_table.py, standard library only)
      homepage: https://www.python.org
      licence:
        - "PSF-2.0"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing annotation information
          e.g. [ id:'I25_prim' ]
    - clusters:
        type: file
        description: "TSS clusters: cagescan all_samples.<set>.tss_clusters.bed (BED9, thickStart = dominant CTSS), or a BED6+ of non-SL clusters (BED mode)"
        pattern: "*.bed"
    - counts:
        type: file
        description: "cagescan all_samples.<set>.tss_cluster_counts.tsv, or [] in BED mode (the BED score is the count)"
        pattern: "*.tsv"
    - sl_counts:
        type: file
        description: "cagescan all_samples.<set>.tss_cluster_sl_counts.tsv, or [] when the dataset has no spliced leader"
        pattern: "*.tsv"
    - sl_leaders:
        type: file
        description: "cagescan all_samples.<set>.tss_cluster_sl_leaders.tsv (several leaders only), or []"
        pattern: "*.tsv"
    - sl_bed:
        type: file
        description: "BED mode: SL trans-splice acceptor clusters (BED6+), or []"
        pattern: "*.bed"
output:
  tsv:
    - - meta:
          type: map
          description: |
            Groovy Map containing annotation information
            e.g. [ id:'I25_prim' ]
      - "*.tss.tsv":
          type: file
          description: "TSS table: chrom, peak (1-based), strand, tss_id, count, sl_count, sl_fraction, tss_type, sl_leader"
          pattern: "*.tss.tsv"
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - python --version | sed 's/Python //':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - python --version | sed 's/Python //':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@johannesnicolaus"
maintainers:
  - "@johannesnicolaus"
